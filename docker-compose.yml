version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: finetube-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finetube-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/finetube
      - JWT_SECRET=finetube-production-jwt-secret-key-32chars
      - CORS_ORIGIN=*
      - DAILY_SANDBOX_QUOTA=50
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:5000/api/v1/health', (r) => { if (r.statusCode !== 200) process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finetube-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
